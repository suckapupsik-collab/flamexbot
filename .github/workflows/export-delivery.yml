name: Temporary FLAMEXBOT delivery export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-delivery.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Package clean source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p full-src mini-app
          git archive HEAD | tar -x -C full-src
          rm -f full-src/.github/workflows/export-delivery.yml
          zip -qr FLAMEXBOT-full-source.zip full-src

          cp index.html package.json .env.example README.md mini-app/
          cp -R src public supabase mini-app/
          zip -qr FLAMEXBOT-mini-app.zip mini-app

          cp supabase/functions/flamexbot-bot/index.ts FLAMEXBOT-bot.ts
          cp supabase/functions/pin-guard/index.ts FLAMEXBOT-pin-guard.ts
      - name: Upload delivery
        uses: actions/upload-artifact@v4
        with:
          name: flamexbot-delivery
          path: |
            FLAMEXBOT-full-source.zip
            FLAMEXBOT-mini-app.zip
            FLAMEXBOT-bot.ts
            FLAMEXBOT-pin-guard.ts
          if-no-files-found: error
          retention-days: 2
