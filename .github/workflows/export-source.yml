name: Temporary FLAMEXBOT source export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-source.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
      - name: Package source files
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=FLAMEXBOT-full-source.zip HEAD

          mkdir -p flamexbot-mini-app
          cp index.html package.json .env.example flamexbot-mini-app/
          cp -R src public supabase flamexbot-mini-app/
          cp README.md flamexbot-mini-app/README-project.md
          zip -qr FLAMEXBOT-mini-app.zip flamexbot-mini-app

          cp supabase/functions/flamexbot-bot/index.ts FLAMEXBOT-bot-index.ts
      - name: Upload source packages
        uses: actions/upload-artifact@v4
        with:
          name: flamexbot-source-export
          path: |
            FLAMEXBOT-full-source.zip
            FLAMEXBOT-mini-app.zip
            FLAMEXBOT-bot-index.ts
          if-no-files-found: error
          retention-days: 2
